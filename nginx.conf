worker_processes  1;

events {
    worker_connections  1024;
}

http {
    # 内置 MIME 映射，避免依赖 nginx 安装目录下的 mime.types
    types {
        text/html              html htm;
        text/css               css;
        application/javascript js mjs;
        application/json       json;
        image/svg+xml          svg;
        image/png              png;
        image/jpeg             jpg jpeg;
        image/gif              gif;
        image/x-icon           ico;
        font/woff2             woff2;
        font/woff              woff;
        application/manifest+json webmanifest;
    }
    default_type  application/octet-stream;

    sendfile      on;
    charset       utf-8;

    server {
        listen       8007;
        server_name  _;

        # 前端构建产物目录（按实际部署路径调整）
        root   /var/www/html/vaccine-calendar/dist;
        index  index.html;

        # 后端接口转发
        location /api/ {
            proxy_pass         http://127.0.0.1:3007;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # 静态文件，未命中时回退到 index.html（SPA 路由）
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
